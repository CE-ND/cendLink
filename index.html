<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./Cend.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CendLink</title>
    <script>
      // 首帧防闪：在任何样式/渲染前，同步读取 localStorage 里的主题写到 <html>。
      // 权威值存在 SQLite（异步 IPC），挡不住首绘，故用 localStorage 镜像 + 系统偏好兜底。
      (function () {
        try {
          var t = localStorage.getItem('cendlink.theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
